<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRECIO DE CIRCUITO</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0f172a">
<style>
  body{background:#0f172a;color:white;font-family:Arial;padding:10px;margin:0}
  .header{display:flex;justify-content:space-between;align-items:center}
  .btn{border:1px solid #2dd4bf;color:#2dd4bf;background:transparent;padding:8px 14px;border-radius:10px;font-weight:bold}
  table{width:100%;border-collapse:collapse;margin-top:15px;background:#162032;border-radius:12px;overflow:hidden}
  th{color:#94a3b8;font-size:12px;padding:10px}
  td{padding:8px;border-top:1px solid #1e293b;text-align:center}
  td:first-child{text-align:left;font-weight:bold;font-size:13px}
  input{width:60px;background:#0f172a;border:1px solid #334155;color:white;padding:8px;border-radius:8px;text-align:center}
  .total{color:#2dd4bf;font-weight:bold}
  .resumen{margin-top:15px;background:#162032;padding:15px;border-radius:12px}
</style>
</head>
<body>
<div class="header">
  <div><h2 style="margin:0">PRECIO DE CIRCUITO</h2><small style="color:#94a3b8">Calculadora de materiales</small></div>
  <div><button class="btn" onclick="location.reload()">LIMPIAR</button></div>
</div>

<table id="tabla">
<thead><tr><th>COMPONENTE</th><th>PRECIO</th><th>CANTIDAD</th><th>TOTAL</th></tr></thead>
<tbody id="tbody"></tbody>
</table>

<div class="resumen">
  <h3>Total: S/ <span id="granTotal">0</span></h3>
</div>

<script>
const componentes = [
["PORTAPILAS",2],["INTERRUPTOR",1],["LED",0.5],["MOTOREDUCTOR",8],["MOTOR DC - BAJO",6],
["MOTOR MABUCHI - MEDIO",9],["MOTOR MABUCHI MMN - ALTO",10],["MOTOR - BOMBA DE AGUA",9],
["PANEL - BAJO",12],["PANEL - MEDIO",15],["BROCHE PARA BATERIA",1],["CABLE",0.5],
["MANGUERA (VENOCLISIS)",1],["JERINGA",0.3]
];
const tbody=document.getElementById('tbody');
componentes.forEach((c,i)=>{
  tbody.innerHTML+=`<tr><td>${c[0]}</td><td>${c[1]}</td><td><input type="number" id="q${i}" oninput="calc()" value=""></td><td class="total" id="t${i}">0</td></tr>`;
});
function calc(){
  let total=0;
  componentes.forEach((c,i)=>{
    let q=parseFloat(document.getElementById('q'+i).value)||0;
    let t=q*c[1]; document.getElementById('t'+i).innerText=t.toFixed(1); total+=t;
  });
  document.getElementById('granTotal').innerText=total.toFixed(1);
}
if('serviceWorker' in navigator){ navigator.serviceWorker.register('./service-worker.js'); }
</script>
</body>
</html>
